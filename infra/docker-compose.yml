version: "3.9"

services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: gym-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gym.local
      PGADMIN_DEFAULT_PASSWORD: change_me
    ports:
      - "5050:80"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: gym-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # puerto AMQP (lo usa el backend)
      - "15672:15672"  # panel web de administración
    environment:
      RABBITMQ_DEFAULT_USER: gym_admin
      RABBITMQ_DEFAULT_PASS: change_me
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
