version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 + extensión pgvector ya incluida
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_platform
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d   # scripts .sql que corren al crear el contenedor (ej: CREATE EXTENSION postgis;)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_admin -d gym_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: gym-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gym.local
      PGADMIN_DEFAULT_PASSWORD: change_me
    ports:
      - "5050:80"
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: gym-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # puerto AMQP (lo usa el backend)
      - "15672:15672"  # panel web de administración
    environment:
      RABBITMQ_DEFAULT_USER: gym_admin
      RABBITMQ_DEFAULT_PASS: change_me
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
