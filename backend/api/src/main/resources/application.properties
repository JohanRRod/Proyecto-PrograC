
# Nombre de la aplicacion
spring.application.name=fitpass

# Puerto del backend
server.port=${PORT:8080}

# Conexion a Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion del pool de conexiones
spring.datasource.hikari.maximum-pool-size=5

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Evitar ejecucion automatica de scripts SQL
spring.sql.init.mode=never

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Confirmacion de publicaciones
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# No reencolar indefinidamente mensajes invalidos
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Publicador Outbox
fitpass.outbox.intervalo-ms=5000

# Cobros mensuales simulados
fitpass.cobros.automaticos-habilitados=false
fitpass.cobros.cron=0 0 6 * * *
fitpass.cobros.dias-gracia=5
fitpass.cobros.zona-horaria=America/Guatemala

# Pruebas de cobros deshabilitadas por defecto

fitpass.cobros.pruebas-habilitadas=${COBROS_PRUEBAS:false}
fitpass.cobros.prueba-membresia-id=${COBROS_PRUEBA_MEMBRESIA_ID:7}


# Autenticacion Supabase
fitpass.security.supabase-url=${SUPABASE_URL}
fitpass.security.supabase-publishable-key=${SUPABASE_PUBLISHABLE_KEY}

# Invitaciones de miembros
fitpass.supabase.admin-key=${SUPABASE_ADMIN_KEY}
fitpass.supabase.redirect-url=${SUPABASE_REDIRECT_URL:http://localhost:5173/auth/callback}

# Minutos durante los cuales se rechaza un check-in repetido
fitpass.accesos.duplicado-minutos=5

# Asistente de IA (Gemini). La clave va solo en variables de entorno.
fitpass.ia.api-key=${GEMINI_API_KEY:}
fitpass.ia.modelo-chat=${GEMINI_MODEL:gemini-3.5-flash-lite}
fitpass.ia.modelo-embedding=gemini-embedding-001
fitpass.ia.dimensiones=1536
fitpass.ia.max-fragmentos=4
fitpass.ia.similitud-minima=0.5
fitpass.ia.mensajes-por-minuto=10
# Presupuesto de razonamiento (solo modelos que lo soportan). -1 = no enviar el parámetro.
fitpass.ia.thinking-budget=${GEMINI_THINKING_BUDGET:-1}
fitpass.ia.timeout-segundos=45
