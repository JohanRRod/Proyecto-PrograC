server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No mostrar la versión de nginx.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API la atiende el contenedor del backend.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El asistente de IA puede tardar hasta 45 s.
        proxy_read_timeout 90s;
        client_max_body_size 5m;
    }

    # Los archivos con hash en el nombre no cambian nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cualquier otra ruta (/admin/clases, /mi, ...) la resuelve React Router.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
